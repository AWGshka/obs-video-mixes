name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    env:
      OBS_VERSION: 32.2.1
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache SDK (OBS headers, Qt)
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ env.OBS_VERSION }}-${{ hashFiles('cmake/obs-sdk.cmake') }}

      - name: Download OBS Studio
        shell: pwsh
        run: |
          $url = "https://github.com/obsproject/obs-studio/releases/download/$env:OBS_VERSION/OBS-Studio-$env:OBS_VERSION-Windows-x64.zip"
          Invoke-WebRequest $url -OutFile obs.zip
          Expand-Archive obs.zip -DestinationPath obs-zip
          $dll = Get-ChildItem obs-zip -Recurse -Filter obs.dll | Where-Object { $_.Directory.Name -eq '64bit' } | Select-Object -First 1
          $root = $dll.Directory.Parent.Parent.FullName.Replace([char]92, [char]47)
          "OBS_DIR=$root" >> $env:GITHUB_ENV
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(obs-video-mixes VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "VMIX_VERSION=$version" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake --preset windows -DOBS_INSTALL_DIR="${{ env.OBS_DIR }}"

      - name: Build
        run: cmake --build --preset windows

      # Headless libobs + D3D11 render checks. GitHub runners have no GPU (WARP only), so a failure here is reported
      # but does not block the build; run ctest locally before releasing.
      - name: Smoke test
        id: smoke
        continue-on-error: true
        run: ctest --preset windows

      # On failure, run each part of the smoke test alone ("none" = load OBS modules only) to narrow it down.
      - name: Narrow down smoke failures
        if: steps.smoke.outcome == 'failure'
        continue-on-error: true
        shell: pwsh
        working-directory: ${{ env.OBS_DIR }}/bin/64bit
        run: |
          $env:PATH = "$PWD;$env:PATH"
          foreach ($s in 'none','program','recording','outputs','filters','source','encoders','audio','framerate') {
            $env:VMIX_SMOKE_SECTIONS = $s
            $out = & "${{ github.workspace }}/build/vmix-smoke.exe" "${{ env.OBS_DIR }}" "${{ github.workspace }}/build/obs-video-mixes.dll" "${{ github.workspace }}/data" 2>&1
            "${s}: " + (($out | Select-String 'FAIL|allocations left') -join ' | ')
          }

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --prefix stage
          cmake --build --preset windows --target package
          iscc /DAppVersion=${{ env.VMIX_VERSION }} /DStageDir="$PWD\stage" /DOutputDir="$PWD\build" installer\obs-video-mixes.iss

      - uses: actions/upload-artifact@v4
        with:
          name: obs-video-mixes-${{ env.VMIX_VERSION }}-windows-x64
          path: |
            build/obs-video-mixes-*-windows-x64.zip
            build/obs-video-mixes-*-windows-x64-installer.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            build/obs-video-mixes-*-windows-x64.zip
            build/obs-video-mixes-*-windows-x64-installer.exe
